<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Sport Voting</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚽ Favorite Sport</h1>
        <p>Pilih olahraga favoritmu!</p>

        <div class="cards">

            <div class="card">
                <div class="emoji">⚽</div>
                <h2>Sepak Bola</h2>
                <p>Votes: <span id="footballVotes">0</span></p>
                <button id="footballBtn">VOTE</button>
            </div>

            <div class="card">
                <div class="emoji">🏀</div>
                <h2>Basket</h2>
                <p>Votes: <span id="basketballVotes">0</span></p>
                <button id="basketballBtn">VOTE</button>
            </div>

            <div class="card">
                <div class="emoji">🏸</div>
                <h2>Badminton</h2>
                <p>Votes: <span id="badmintonVotes">0</span></p>
                <button id="badmintonBtn">VOTE</button>
            </div>

            <div class="card">
                <div class="emoji">🏊</div>
                <h2>Renang</h2>
                <p>Votes: <span id="swimmingVotes">0</span></p>
                <button id="swimmingBtn">VOTE</button>
            </div>

        </div>

        <h2>Total Votes: <span id="totalVotes">0</span></h2>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
